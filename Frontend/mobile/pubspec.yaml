name: urbansense_mobile
description: AI UrbanSense — Driver Mobile Application for public transport urban sensing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3+1

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # GPS
  geolocator: ^12.0.0

  # Camera
  camera: ^0.11.0+2

  # Map (Leaflet-based, no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local database (offline queue)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # Network state
  connectivity_plus: ^6.0.3

  # UUID for client_event_id
  uuid: ^4.4.0

  # Image caching
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^0.68.0

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
