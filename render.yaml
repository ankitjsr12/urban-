# Render Blueprint — one-click deploy for AI UrbanSense API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: urbansense-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually (Neon connection string)
      - key: REDIS_URL
        sync: false  # Set manually (Upstash connection string)
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false  # Set manually (Cloudflare R2 endpoint)
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: urbansense-evidence
      - key: S3_REGION
        value: auto
      - key: CORS_ORIGINS
        sync: false  # Set manually (your frontend domains)
      - key: AI_SERVICE_URL
        value: ""
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
